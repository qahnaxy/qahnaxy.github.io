<svg xmlns="http://www.w3.org/2000/svg" viewBox="11 6 78 78">
  <!-- circular Q ring -->
  <circle cx="50" cy="45" r="32" fill="none" stroke="#3B82F6" stroke-width="14" stroke-linecap="round"/>

  <!-- inner cut to create Q opening illusion -->
  <circle cx="50" cy="45" r="18" fill="#E5EDFF"/>

  <!-- Q tail -->
  <rect x="58" y="58" width="18" height="12" fill="#3B82F6" transform="rotate(45 58 58)" rx="2"/>
</svg>